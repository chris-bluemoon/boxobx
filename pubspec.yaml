name: boxbox
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  record: ^6.0.0
  just_audio: ^0.9.40
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  flutter_dotenv: ^5.1.0
  cipherlib: ^0.7.2
  shared_preferences: ^2.5.3
  path: ^1.9.1
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.42

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    # Barlow Condensed (SIL Open Font License, assets/fonts/OFL.txt) --
    # the Box Box wordmark (see BoxBoxLogo).
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-ExtraBoldItalic.ttf
          weight: 800
          style: italic
  assets:
    - assets/config/tracks_db.json
    - assets/config/all_tracks.json
    - assets/config/track_outlines.json
    - assets/audio/click_pshh.mp3
    - assets/audio/splash_pitstop_sync.m4a
    - .env
